<!DOCTYPE html>
<html ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <title>Student Management Mini Application</title>
   
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body>

   
    <div ng-controller="CollegeController">
        
        
        <header>
            <h1>{{ collegeName }}</h1>
            <h2>Student Management Mini Application</h2>
        </header>

        
        <div ng-controller="StudentController">

            
            <section>
                <h3>Student Entry Form</h3>
                <div>
                    <label>Name: </label>
                    <input type="text" ng-model="studentName" placeholder="Enter student name">
                </div>
                <div>
                    <label>Department: </label>
                    <input type="text" ng-model="department" placeholder="Enter department">
                </div>
                <div>
                    <label>Semester: </label>
                    <input type="text" ng-model="semester" placeholder="Enter semester">
                </div>
                <div>
                    <label>Marks: </label>
                    <input type="number" ng-model="marks" placeholder="Enter marks">
                </div>
            </section>

           
            <section>
                <h3>Actions</h3>
                <button ng-click="addStudent()">Add Student</button>
                <button ng-click="toggleDetails()">Show/Hide Details</button>
            </section>

           
            <section ng-show="showDetails">[cite: 2]
                <h3>Student Details</h3>
                <p><strong>Name:</strong> {{ studentName }}</p>
                <p><strong>Department:</strong> {{ department }}</p>
                <p><strong>Semester:</strong> {{ semester }}</p>
            </section>

           
            <section>
                <h3>Student List</h3>
                <ul>
                    <li ng-repeat="student in students">
                        {{ student }}
                    </li>
                </ul>
            </section>

            
            <section>
                <h3>Examination Result</h3>
                <p ng-class="{'pass': marks >= 40, 'fail': marks < 40}">
                    <span ng-if="marks >= 40">Pass</span>
                    <span ng-if="marks < 40">Needs Improvement</span>
                </p>
            </section>

        </div>
    </div>

    
    <script src="app.js"></script>
</body>
</html>
